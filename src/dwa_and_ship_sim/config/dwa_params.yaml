dwa_planner:
  ros__parameters:
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    path_topic: /hybrid_a_star_trajectory
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    costmap_topic: /local_costmap
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    odom_topic: /odom
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    cmd_vel_topic: /cmd_vel

    # 三者必须使用相同坐标系
    # [作用与调节] 坐标系/TF frame名称。修改须与消息头、TF及接收节点一致；不是数值大小参数，缺失或失配会拒绝输入。
    control_frame: odom

    # [作用与调节] DWA控制频率(Hz)。增大：响应更快、动态窗口单步更小、算力更高；减小：控制粗、保护响应更迟；与本船20Hz仿真配套。
    control_frequency: 20.0

    # 最高航速4m/s（约7.78节）。
    # 必须与 Hybrid A* cruise_speed 和仿真器 max_linear_speed 保持一致。
    # [作用与调节] DWA最大候选前进速度(m/s)。增大：速度偏好更高、需更长制动/预测；减小：巡航更慢；与Hybrid cruise_speed及仿真上限同步。
    max_vel_x: 4.0
    # 接近终点按v<=min(0.5*剩余距离,sqrt(2*a*剩余距离))降速。
    # a低于仿真制动加速度；终点位置收敛评分同时生效，防止高速绕圈。
    # [作用与调节] DWA终点制动加速度(m/s²)。增大：可更晚制动；减小：更早减速；实际还受acc_lim_x限制，与Hybrid预测模型同步。
    goal_deceleration: 0.5
    # [作用与调节] DWA候选线速度下界(m/s)。增大：缺少慢速/零候选可能妨碍安全；减小到负数会允许倒车候选，但模型/规则需另验证。
    min_vel_x: 0.0
    # [作用与调节] 最大候选角速度(rad/s)。增大：更急转、可解窄转弯但易摆动；减小：更温和但可能追不上曲率。
    max_vel_theta: 1.2

    # 加速度限制，决定运动平滑程度
    # [作用与调节] DWA动态窗口线加速度(m/s²)。增大：指令响应快、变化更大；减小：变化慢/制动窗口更受限；应匹配仿真惯性。
    acc_lim_x: 0.7
    # [作用与调节] DWA动态窗口角加速度(rad/s²)。增大：转向更灵敏易摆动；减小：转向缓慢，急避让能力也下降。
    acc_lim_theta: 1.8

    # DWA 预测轨迹时长和离散步长
    # [作用与调节] DWA常速候选预测时长(s)。增大：看得远但常速模型误差/计算变大；减小：近视，可能太晚避障；追越近终点另有10s检查。
    sim_time: 3.0
    # [作用与调节] DWA积分时间步长(s)。增大：点少但碰撞检查粗；减小：预测细、计算/显示开销上升。
    sim_granularity: 0.05

    # 候选速度采样数量
    # [作用与调节] 线速度候选数。增大：速度选择细、候选数量与w_samples相乘增长；减小：算力低但可能漏安全控制。
    v_samples: 21
    # [作用与调节] 角速度候选数。增大：转向选择细、算力增加；减小：转向粗更可能摇摆或无可行候选。
    w_samples: 31

    # 基础前视距离；程序会随当前速度自适应增大
    # [作用与调节] 基础前视弧长(m)，随速度额外增大。增大：提前转弯、跟踪更平缓但可能切角；减小：贴路径细节、易晚转摆动。
    lookahead_distance: 5.0
    # 8节时需要更远前视，避免仍按旧版3m上限追踪并频繁降速。
    # [作用与调节] 速度自适应前视上限(m)。增大：高速更远前视/更早转向；减小：近端响应更细但高速可能转弯太迟。
    max_lookahead_distance: 10.0

    # 最终目标停车距离
    # [作用与调节] DWA终点中心位置容差(m)。增大：更早停车、终点误差更大；减小：更精确但可能难收敛；每个活动Hybrid目标均适用。
    goal_tolerance: 0.4

    # 转弯时仍保持的最小前进速度
    # [作用与调节] 转弯限速公式的最低前进参考(m/s)。增大：急弯保持更多前进；减小：更慢转弯；不能绕过安全STOP。
    min_cruise_speed: 0.12

    # Must match Hybrid A*: extra 1 m absorbs tracking/discretisation error.
    # [作用与调节] 本船规划圆形半径(m)。增大：硬净空更大、绕行更宽；减小：更贴近且碰撞裕度减小；Hybrid/DWA须一致。
    own_ship_radius: 1.5
    # [作用与调节] 两船半径之外的安全冗余(m)。增大：提前/更宽绕行、可行空间减少；减小：更靠近目标、抗跟踪误差更差；两级须一致。
    safety_buffer: 0.5
    # 当前两船中心间距小于8m，独立于DCPA/TCPA立即发布零速度命令。
    # [作用与调节] 当前两船中心距离STOP半径(m)。增大：更早停车；减小：更接近才停车；独立于CPA，零指令不代表船体瞬停。
    colregs_risk_distance: 3.0
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    target_odom_topics: [/target_boat/odom]
    # [作用与调节] 目标消息有效时间(s)。增大：容忍通信抖动但预测更旧；减小：更快失联停车、也更易误停。
    target_state_timeout: 2.0
    # 追越采用稍大的中心间距；不能小于半径之和+buffer（7.5m）。
    # [作用与调节] 追越最小中心净空(m)，实际取其与半径和+buffer的较大值。增大：侧向更宽；减小到7.5m以下也不会降低基本硬净空。
    overtaking_safe_distance: 4.0

    # 航道外岸边膨胀达到 88 即淘汰，避免贴近高风险区域。
    # [作用与调节] 静态硬危险代价门槛。增大：允许更高代价、可能更贴岸；减小：更保守易无解；Hybrid启用channel时以分源阈值为准。
    lethal_cost_threshold: 88
    # [作用与调节] DWA为true拒绝未知、false允许未知参与评分，后者风险大；局部地图活动实现中此项声明但未使用，始终保留-1。
    unknown_is_obstacle: true

    # 与 Hybrid A* 共用航道策略。仅消除航道内的岸边膨胀；未来感知
    # 发布到 /channel/obstacle_costmap 的障碍物膨胀不会被清零。
    # [作用与调节] true：启用分源航道语义融合；false：退回原地图单层判定/评分。开阔水域演示明确关闭，河道模式保持开启。
    channel.enabled: true
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    channel.lane_costmap_topic: /channel/lane_costmap
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    channel.obstacle_costmap_topic: /channel/obstacle_costmap
    # [作用与调节] 主航道语义上界，与管理器编码一致；修改不是调整船距，失配会把边沿误分类。
    channel.main_lane_value_max: 20
    # [作用与调节] 对向语义下界，与75编码配套；增大可能漏判左航道，减小可能把航道外误判为航道内；非物理硬阈值。
    channel.opposite_lane_value_min: 65
    # [作用与调节] 独立/channel/obstacle_costmap禁止阈值。增大：允许更高障碍膨胀；减小：更保守更早绕开；航道内也生效。
    channel.obstacle_cost_threshold: 85
    # 将主航道 0..20 的中心软梯度映射到 DWA 评分；不会成为硬障碍。
    # 与全局规划一致地偏向主航道中心；边沿仍低于硬碰撞阈值。
    # [作用与调节] DWA把主航道边沿值转换为评分代价倍率。增大：更偏中心；减小：更贴边；过大会逼近硬阈值而使边沿成为禁止候选。
    channel.center_cost_scale: 2.5

    # 路径跟踪、向前推进、朝向、局部避障评分
    # [作用与调节] DWA路径贴合分数权重。增大：更贴Hybrid路径；减小：更愿局部偏离；其他分项与硬约束共同决定。
    path_weight: 3.5
    # [作用与调节] DWA沿路径前进分数权重。增大：更偏向推进；减小：允许保守/侧向机动；不能消除动态硬约束。
    progress_weight: 4.5
    # [作用与调节] DWA路径切向一致分数权重。增大：更对齐路径方向；减小：接受更多横向朝向差。
    heading_weight: 1.2
    # [作用与调节] DWA低代价避障分数权重。增大：更远离高代价；减小：更偏效率；危险候选仍硬淘汰。
    obstacle_weight: 4.0

    # 高速度和命令连续性的评分
    # 安全候选中明显偏向8节巡航；急转弯或碰撞风险仍可由硬约束降速。
    # [作用与调节] DWA速度偏好权重。增大：安全候选更偏高速；减小：跟踪/避障更容易选慢速；终点限速仍生效。
    speed_weight: 30.0
    # [作用与调节] DWA命令连续性分数权重。增大：变化小、可能响应慢；减小：响应快但角速度更易来回切。
    smooth_weight: 0.45
    # [作用与调节] DWA靠近前视点分数权重。增大：更追前视点、可能削角；减小：路径整体贴合等分项更占主导。
    target_weight: 1.5

    # 超过任一时限会立即停车，防止继续跟踪过期轨迹/地图。
    # Hybrid A*超过3秒没有发布新有效路径时停车。显示端仍保留最后有效轨迹，
    # 所以安全停车不会再表现为RViz轨迹周期性闪烁。
    # [作用与调节] Hybrid有效路径接收过期时间(s)。增大：可继续跟较旧路径；减小：更快停车但更容易因搜索延迟停船。
    path_stale_timeout: 3.0
    # river_chart/local_costmap 是一次性静态发布，0 表示不按时间判过期。
    # 将来接入连续更新的感知局部图时应改回正数（例如 2.0）。
    # [作用与调节] 地图接收过期时间(s)，<=0禁用时间过期但保留frame检查。增大：容忍旧图；减小正数：更快保护；静态一次地图用0。
    costmap_stale_timeout: 0.0
