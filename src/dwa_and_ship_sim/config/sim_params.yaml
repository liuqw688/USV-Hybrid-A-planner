boat_simulator:
  ros__parameters:
    # 实际河道测试起点（已验证位于 ORIENT=327° 的 TSSLPT 分道内）。
    # [作用与调节] 本船起点东向坐标(m)。增大向东、减小向西；必须在地图有效安全水域，重启才加载。
    start_x: -270.0
    # [作用与调节] 本船起点北向坐标(m)。增大向北、减小向南；必须与海图坐标/scale一致。
    start_y: -270.0
    # S-57 327°（真北顺时针）换算为 ROS ENU yaw 约 123°。
    # [作用与调节] 本船初始ROS yaw(rad)，0东、正逆时针。增大逆时针转、减小顺时针；低速首次COG会采用该方向。
    start_yaw: 2.14675498
    # 最高航速4m/s；有效路径出现后由DWA选择安全巡航速度。
    # [作用与调节] 启动实际/目标线速度(m/s)。增大：初始运动更快；减小：更慢；本船受限速和惯性、虚拟船直接匀速积分。
    initial_speed: 4.0
    # 仿真器硬限速，避免控制命令超过船舶最高航速。
    # 必须与 DWA max_vel_x 和 Hybrid A* cruise_speed 保持一致。
    # [作用与调节] 本船仿真线速度硬上限(m/s)。增大：允许更快命令；减小：截断DWA速度、预测到达时间可能失配；三处航速同步。
    max_linear_speed: 4.0
    # [作用与调节] true：启用仿真代码内置圆/多边形扫描与显示；false：清空内置几何；不关闭river_chart真实陆地。
    static_obstacles_enabled: false
