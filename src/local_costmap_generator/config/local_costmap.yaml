local_costmap_node:
  ros__parameters:
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    input_topic: /chart_costmap   #/local_obstacle_map #
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    output_topic: /local_costmap

    # local_obstacle_map 中 >= 90 的格子是绝对障碍物。
    # [作用与调节] 输入格成为硬障碍距离传播种子的门槛。增大：较少格被视为硬障碍；减小：更多格产生膨胀、更保守。
    occupied_threshold: 90

    # 你的障碍物图没有未知格时，该参数不影响结果。
    # [作用与调节] 兼容参数：当前活动buildCostmap未读取此开关，true/false均保留未知-1；不能通过改false放开未知水域。
    unknown_is_obstacle: true

    # 船体外接半径。
    # [作用与调节] 障碍硬高代价(99)扩展半径(m)，不是仅显示船体半径。增大：高代价禁入带更宽；减小：更贴岸；当前3m与规划半径1.5m不同。
    robot_radius: 3.0

    # 从障碍物/高代价外侧开始额外产生渐变代价区域的范围。
    # [作用与调节] 障碍半径外/高代价源的渐变传播范围(m)。增大：更宽梯度、可通行空间/计算受影响；减小：更近才产生代价。
    inflation_radius: 15.0   

    # 膨胀指数公式的远端代价基准（不是对所有低代价格统一清零的阈值）。
    # [作用与调节] 膨胀公式远端基准代价。增大：传播范围内远端代价更高；减小：更接近自由区；当前不是全图低值统一清零阈值。
    minimum_cost: 1 

    # ================= 新增参数 =================
    # 高代价区域的阈值。>= 此值且 < occupied_threshold 的格子将被视为高代价起点。
    # [作用与调节] 未达硬障碍但作为高代价源的门槛。增大：高代价种子更少；减小：更多输入格参与第二距离传播。
    high_cost_threshold: 50
    
    # 指数衰减因子。值越大，代价随距离下降得越快。
    # [作用与调节] 指数衰减系数。增大：同距离代价下降更快；减小：高代价保持更远；传播总半径仍由inflation_radius控制。
    decay_factor: 3.0
