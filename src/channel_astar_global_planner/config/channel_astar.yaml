channel_astar_node:
  ros__parameters:
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    lane_costmap_topic: /channel/lane_costmap
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    odom_topic: /odom
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    goal_topic: /goal_pose
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    output_topic: /astar_channel_waypoints
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    active_goal_topic: /goal_pose_from_astar
    # [作用与调节] 沿A*累计弧长的普通采样间距(m)。增大：航点更少、Hybrid单段更长；减小：目标切换更频繁、端段连接更细；须大于goal_switch_distance。
    waypoint_spacing: 100.0
    # 普通航点允许提前切换；不能超过采样间距，否则可能连续跳点。
    # [作用与调节] 普通航点切换半径(m)。增大：更早切换、可能削切转弯；减小：更接近航点才切换、可能频繁减速；必须小于航点间距。
    goal_switch_distance: 10.0
    # 必经途经点必须到达此半径内才切换，不能使用普通8m阈值跳过。
    # [作用与调节] 必经途经点到达半径(m)。增大：经过误差更大、切换更早；减小：要求更精确、跟踪困难时可能不切换。
    mandatory_goal_distance: 4.0
    # 按输入顺序必经的坐标，单位m，必须与航道图同坐标系并位于主航道。
    # 例如 [x1, y1, x2, y2]；当前源码未发现海图途经点话题，故提供明确配置入口。
    # 无途经点时保持下面一行注释，使用节点默认空列表；Humble不能解析YAML空数组。
    # 格式示例（不是此河图已验证可通行的坐标，启用前须替换为实际途经点）：
    # via_points: [150.0, 30.0, 220.0, 45.0]
    # [作用与调节] true：主体限制主航道，仅起末段开放左/外连接；false：放开0..95语义搜索，右行限制明显弱化，并不取消物理安全检查。
    right_channel_only: true
    # [作用与调节] 主航道语义上界，须与管理器一致。增大/减小会改变类别解释而非物理安全距离；不要单包随意调整。
    main_lane_value_max: 20
    # 对向/左航道的语义编码，须与channel_navigation_manager的opposite_value一致。
    # [作用与调节] 对向航道语义编码，须与管理器opposite_value一致。大小不是概率或距离；不一致会漏判左航道。
    opposite_lane_value: 75
    # 航道外区域编码及额外代价：右主航道优先，航道外其次，对向航道代价最高。
    # [作用与调节] 航道外语义编码，须与管理器outside_value一致。大小不是风险半径，修改需同步上下游。
    outside_lane_value: 45
    # [作用与调节] 全局A*航道外额外行程代价。增大：更少离开主航道；减小：更愿选择安全航道外短路线；不能绕过硬危险阈值。
    outside_lane_penalty: 1.0
    # 必须与航道图同网格的真实安全地图；岸边危险/未知区域不能因语义45被放开。
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    safety_costmap_topic: /local_costmap
    # 与Hybrid channel.shoreline_cost_threshold一致；航道外>=88及未知(-1)禁止通行。
    # [作用与调节] 航道外物理格禁止阈值，>=此值及未知拒绝。增大：允许更高代价、更贴危险区；减小：更保守且可能无解；与Hybrid岸边阈值一致。
    safety_cost_threshold: 88
    # 最终目标在左航道或航道外时，仅在目标附近此半径(m)内开放末段非主航道。
    # 默认与100m航点间距一致；宽航道需适当增大，否则可能没有末段连通路径。
    # [作用与调节] 起点/终点非主航道连接半径(m)。增大：宽航道/远外目标更容易连通，但可借用更长非主航道；减小：更晚跨入、更可能无解。
    terminal_crossing_distance: 100.0
    # 左航道额外行程代价：增大越倾向一直走右航道，临近终点再跨入。
    # 这是软偏好，不是强制指定十个点中的九个点。
    # [作用与调节] 全局A*左/对向航道额外行程代价。增大：更晚跨入、减少对向行程；减小：更可能较早跨入；建议高于航道外偏好代价。
    opposite_lane_penalty: 4.0
    # [作用与调节] 全局A*语义代价倍率。增大：更偏好右航道中心且避免高类别代价；减小：更偏短距离/贴边；与额外区域代价共同生效。
    center_cost_weight: 0.08
    # [作用与调节] 全局A*最大出队次数。增大：复杂长路线更可能找到、耗时增加；减小：更省算力但易达到上限，无解不自动重试。
    max_search_iterations: 200000
    # 新目标点击后等待此时间，再由输入回调完成首次规划，避免抢先使用旧方向图。
    # 重复图、中心梯度变化和船体运动不触发重规划；主/对向角色互换除外。
    # [作用与调节] 目标/角色变化后等待输入更新的时间(s)，无规划timer。增大：更易合并抖动但启动/纠偏停车更久；减小：响应快但可能抢用旧分类。
    map_settle_time: 0.5
    # 目标请求/TF等待重试的最低间隔；无规划timer，不是固定重规划频率。
    # [作用与调节] 两次任务尝试的最短间隔(s)，不是固定搜索周期。增大：限制连续请求算力、响应更慢；减小：响应快、TF缺失时尝试更频繁。
    minimum_replan_period: 0.5
    # 主航道0..20与对向航道75互换时，触发一次纠偏重规划；无固定规划timer。
    # 普通中心代价变化/重复地图/船移动不触发；连续角色变化由map_settle_time合并。
    # [作用与调节] true：0..20与75角色互换触发一次纠偏；false：仅目标或人工服务重规划；梯度变化和重复图不触发。
    replan_on_lane_role_change: true
