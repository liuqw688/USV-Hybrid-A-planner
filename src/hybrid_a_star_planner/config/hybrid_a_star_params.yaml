hybrid_a_star_node:
  ros__parameters:
    # 安全监测频率，不再表示每秒都执行Hybrid A*搜索。缓存路径会按此频率
    # 刷新时间戳；新目标或剩余路径重新出现风险时才真正搜索。
    # [作用与调节] 事件安全检查频率(Hz)。增大：更快发现新风险、轻量检查更频繁；减小：响应变慢。
    planner_frequency: 1.0
    # true为事件规划：正常只规划一次；false恢复每个timer周期完整重规划。
    # [作用与调节] 开启后显著降低搜索量并固定DWA跟踪轨迹；安全监测和CPA更新仍持续运行。
    event_driven.enabled: true
    # 同一次会遇已成功规划后，只有剩余轨迹重新进入2m预测硬域才再次规划；
    # 首次COLREG风险仍由远距离DCPA/TCPA状态提前触发，不会等到2m。
    # [作用与调节] 不建议小于普通硬净空；增大容易让同一次会遇重复规划。
    event_driven.collision_trigger_distance: 2.0
    # 本船偏离缓存轨迹超过该距离时重新规划，处理流扰动或跟踪误差。
    # [作用与调节] 增大：更愿意继续旧轨迹；减小：偏航后更快重规划。
    event_driven.cross_track_limit: 8.0
    # 目标船相对上次成功规划的航向变化超过5度，视为新机动并重新规划。
    event_driven.target_course_change: 0.0872664626
    # 目标船相对上次成功规划的速度变化超过0.3m/s，视为新机动。
    event_driven.target_speed_change: 0.3
    # 每次需要重规划时最多生成几个候选方案(1~3)，选择不绕圈且代价/长度更好的方案。
    event_driven.search_attempts: 3
    # 终点附近绕圈/异常长路线质量门槛；超过则不发布路径，等待下一次安全重算。
    event_driven.max_path_length_ratio: 3.0
    event_driven.max_path_extra_distance: 40.0
    event_driven.goal_loop_radius: 3.0
    event_driven.goal_loop_min_arc: 8.0
    # 单次重规划失败时最多保留最近有效路径3秒，避免RViz闪烁；持续失败后
    # 当前实现不按此参数清空显示；DWA路径过期停车。新目标会立即清空旧路径一次。
    # [作用与调节] 最近路径有效性标志保留时间(s)。增大：更晚标为无效；减小：更早失效；当前不直接清除RViz路径，停车由DWA路径过期负责。
    path_failure_hold_time: 3.0
    # 远目标搜索期间单线程执行器不能处理odom回调；5秒可避免将约1秒的计算
    # 阻塞误判为里程计失联。DWA仍有独立的数据过期停车保护。
    # [作用与调节] Hybrid船位消息时间容忍(s)。增大：容忍搜索阻塞但允许较旧船位；减小：更快失联保护、可能误判计算延迟。
    own_odom_timeout: 5.0
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    trajectory_topic: /hybrid_a_star_trajectory
    # A* 的完整结果是 nav_msgs/Path；Hybrid A* 只接收 A* 当前选中的
    # geometry_msgs/PoseStamped。两种消息不能使用同一个 topic。
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    goal_topic: /goal_pose_from_astar
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    costmap_topic: /local_costmap
    # [作用与调节] 坐标系/TF frame名称。修改须与消息头、TF及接收节点一致；不是数值大小参数，缺失或失配会拒绝输入。
    global_frame: odom
    # [作用与调节] 坐标系/TF frame名称。修改须与消息头、TF及接收节点一致；不是数值大小参数，缺失或失配会拒绝输入。
    base_frame: base_link

    # Hybrid A* motion primitives. The turning radius is approximately
    # wheelbase / tan(max_steering_angle).
    # [作用与调节] Hybrid每次运动基元长度(m)。增大：扩展少、细节粗且更难窄处绕行；减小：搜索细但状态/检查更多。
    step_size: 2.0
    # [作用与调节] Hybrid启发估计用的最小转弯半径(m)。增大：估计更不愿急转；减小：启发更灵活；实际基元/Dubins由wheelbase与舵角决定，须保持一致。
    min_turning_radius: 9.0
    # [作用与调节] 简化转向模型轴距(m)。增大：相同舵角转弯半径更大；减小：可更急转；需反映船舶可实现转弯能力。
    wheelbase: 5.0
    # [作用与调节] 基元最大转角(rad)，R约wheelbase/tan(angle)。增大：转弯更紧、急弯更多；减小：更平缓但窄处无解；不是Twist角速度。
    max_steering_angle: 0.5
    # [作用与调节] 姿态离散角步长(rad)。增大：状态少但航向粗；减小：航向细、状态和搜索代价增加。
    d_theta: 0.10
    # [作用与调节] Hybrid最大扩展/出队次数。增大：长路线更易完成、延迟/算力增加；减小：易搜索失败并触发DWA路径过期停车。
    max_iterations: 250000
    # 旧版单层阈值，仅在关闭 channel.enabled 时作为兼容参数使用。
    # [作用与调节] 静态硬危险代价门槛。增大：允许更高代价、可能更贴岸；减小：更保守易无解；Hybrid启用channel时以分源阈值为准。
    lethal_cost_threshold: 88

    # ================= 轨迹连续性与大惯性船舶平滑 =================
    # 新轨迹偏离上一条有效轨迹时的软代价。每个周期仍完整执行Hybrid A*；
    # 该项只让无新风险时的相邻规划保持连续，安全需要时允许主动偏离。
    # [作用与调节] 偏离上次安全路径的软代价倍率。增大：跨周期路线更稳定但可能保留绕路；减小：更追求当前短路但更易跳线；不锁死旧路线。
    stability.reference_path_weight: 0.5
    # 本船近前方跨周期稳定的额外软权重。采用偏离距离平方项；碰撞和COLREG硬检查始终优先。
    # [作用与调节] 增大：更不容易在旧路径两侧跳变，但必要绕障初期可能更保守；减小：更灵活但近场前视点更易跳动。建议4~12。
    stability.near_field_reference_weight: 12.0
    # 近场稳定项从本船处最强，到该前向距离处衰减为0；远端路线仍可提前改变。
    # [作用与调节] 增大：稳定更长前方区段；减小：只稳定紧邻船首。4m/s船建议30~50m。
    stability.near_field_reference_horizon: 45.0
    # 偏离达到该距离时，近场平方代价约等于上述权重；不是硬走廊宽度。
    # [作用与调节] 增大：同样偏离受到的约束更弱；减小：小偏离也会快速受罚。建议3~6m。
    stability.near_field_deviation_scale: 3.0
    # 恢复目标方向仍有同步碰撞风险时，额外偏好上一条安全路线；纯软代价。
    # 不锁死航向，不强制直航。减小响应更灵活，增大减少避让过程跳线。
    # [作用与调节] 恢复方向仍不安全时的额外近端连续性代价。增大：减少避让中跳线；减小：更灵活但易摇摆；恢复安全时门控关闭。
    stability.recovery_weight: 4.0
    # 额外连续性只影响近端约航速×6秒范围，随距离衰减；恢复安全立即关闭。
    # [作用与调节] 风险恢复软偏好的近端时间尺度(s)。增大：影响更长前方范围；减小：只影响船前短段；不是强制直航或解锁等待时间。
    stability.recovery_horizon: 6.0
    # 动态检查考虑终点减速，避免用全程4m/s误判恢复路线的到达时间。
    # 必须与DWA goal_deceleration、goal_tolerance保持一致。
    # [作用与调节] true：动态到达时间考虑终点减速；false：更接近全程巡航外推，终点附近CPA同步可能偏乐观。
    prediction.goal_braking: true
    # [作用与调节] 终点到达模型制动加速度(m/s²)。增大：预测可更晚减速、到达更快；减小：更早减速、到达更慢；与DWA终点制动匹配。
    prediction.goal_deceleration: 0.5
    # [作用与调节] 动态预测终点剩余距离扣除容差(m)。增大：更早视为终点邻域；减小：更接近精确目标；与DWA goal_tolerance匹配。
    prediction.goal_tolerance: 0.4
    # 仅是预测积分速度下限，避免终点时间无穷；不是实际船速下限。
    # [作用与调节] 预测积分的速度下限(m/s)。增大：估计到达更快；减小：估计更慢、更保守且时间更大；不是实际船速下限。
    prediction.minimum_speed: 0.3
    # 偏离上一轨迹超过12m后连续性代价饱和，避免旧路线阻止必要的大绕行。
    # [作用与调节] 旧路线偏离代价饱和距离(m)。增大：远离旧路仍受约束；减小：更早饱和、允许必要大绕行更容易。
    stability.reference_path_max_distance: 12.0
    # 相邻运动基元反复改变舵角的惩罚，减小全局轨迹波浪形摆动。
    # [作用与调节] 相邻基元转角改变惩罚。增大：减少左右反复短弧；减小：搜索更灵活、整体更波浪。
    stability.steering_change_weight: 1.5
    # 持续大舵角的平方惩罚，减少少量但尺度很大的S弯；避障/COLREG可覆盖。
    # [作用与调节] 大转角平方惩罚。增大：减少大S弯、转向更温和；减小：急转更容易；硬避障仍优先。
    stability.steering_magnitude_weight: 1.0
    # 每个周期仍重新运行Hybrid A*，上一轨迹仅作为软参考，不直接复用。

    # 搜索完成后统一重采样并做全局平滑；每轮结果都会重新执行静态障碍、
    # 动态船时间同步安全域和COLREG航向检查，不安全时自动保留原安全路径。
    # [作用与调节] true：搜索后重采样/平滑并安全复查；false：输出原搜索轨迹，安全检查仍在搜索中执行。
    smoothing.enabled: true
    # [作用与调节] 后处理弧长采样间距(m)，代码至少0.25m。增大：点少/计算少但曲线细节粗；减小：更细、每轮安全检查更贵。
    smoothing.resample_spacing: 1.0
    # [作用与调节] 平滑最大轮数。增大：可能更平顺、耗时更长；减小：后处理轻但原始曲折残留；安全门槛不变。
    smoothing.iterations: 120
    # 拉直连续短圆弧的权重，以及保持接近原安全轨迹的权重。
    # [作用与调节] 相邻点拉直权重。增大：短波弯更平但大步易被安全复查拒绝；减小：保持原始短圆弧更多。
    smoothing.smooth_weight: 0.26
    # [作用与调节] 回拉原安全路线的权重。增大：偏移小、更保留原弯；减小：更能拉直，仍受最大偏移和安全检查限制。
    smoothing.data_weight: 0.015
    # 每侧取6个1m采样点，以约12m弦长抑制整体宽大S弯。
    # [作用与调节] 长尺度每侧跨越的采样点数。增大：抑制更长波S弯、也可能拉直真实河弯；减小：只处理短波；尺度随采样间距变化。
    smoothing.long_range_points: 6
    # [作用与调节] 长尺度弦中点拉直权重。增大：更压低宽大S弯、步长可能被安全拒绝；减小：更保留长弯。
    smoothing.long_range_weight: 0.12
    # 平滑点最多偏离Hybrid A*原始安全轨迹6m；每轮仍必须通过完整安全检查。
    # [作用与调节] 平滑点距重采样原路径最大偏移(m)。增大：更有空间拉直但可能贴危险边界；减小：保持原路线更多；0关闭此软限幅，安全检查仍在。
    smoothing.max_deviation: 6.0

    # ================= 航道语义与分源安全融合 =================
    # [作用与调节] true：启用分源航道语义融合；false：退回原地图单层判定/评分。开阔水域演示明确关闭，河道模式保持开启。
    channel.enabled: true
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    channel.lane_costmap_topic: /channel/lane_costmap
    # 原始陆地核心层：即使位于航道多边形内也绝不覆盖。
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    channel.static_land_topic: /chart_static_obstacles
    # 为后续感知障碍物预留的独立膨胀层。该层不会被“航道自由水域”清零。
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    channel.obstacle_costmap_topic: /channel/obstacle_costmap

    # 航道外的岸边膨胀达到该值即禁止；低值仍作为软代价。
    # [作用与调节] 航道外岸边膨胀硬阈值。增大：可更贴岸；减小：更保守易无解；航道内仍优先陆地核心及独立障碍检查。
    channel.shoreline_cost_threshold: 88
    # 航道内/外的独立障碍物膨胀达到该值即禁止。
    # [作用与调节] 独立/channel/obstacle_costmap禁止阈值。增大：允许更高障碍膨胀；减小：更保守更早绕开；航道内也生效。
    channel.obstacle_cost_threshold: 85
    # channel_navigation_manager 编码：0..20=主航道中心梯度，45=航道外，75=对向。
    # [作用与调节] 主航道语义上界，与管理器编码一致；修改不是调整船距，失配会把边沿误分类。
    channel.main_lane_value_max: 20
    # [作用与调节] 对向语义下界，与75编码配套；增大可能漏判左航道，减小可能把航道外误判为航道内；非物理硬阈值。
    channel.opposite_lane_value_min: 65

    # 每米区域软代价。主航道为 0；航道外优于对向航道，但更短的对向路径
    # 仍可被搜索考虑，不采用“右侧失败后才开放左侧”的绝对规则。
    # [作用与调节] Hybrid航道外每米软代价。增大：减少离开主航道；减小：更愿安全航道外绕行；建议低于对向权重。
    channel.outside_lane_weight: 2.5
    # [作用与调节] Hybrid对向航道每米软代价。增大：更少借用左航道、更快回主航道；减小：可选择更短对向绕行；末段目标仍可达到。
    channel.opposite_lane_weight: 4.0
    # 中心为0、靠边运动基元最高增加2.0代价。航道外代价仍高于主航道
    # 边沿，因此正常规划不会为了缩短直线距离而离开主航道。
    # COLREG或障碍物需要时仍可驶近边沿。
    # [作用与调节] Hybrid主航道中心梯度权重。增大：远离边沿、更居中；减小：更可能贴边短路线；不产生硬禁入边界。
    channel.main_center_weight: 2.0
    # 航道外岸边渐变代价权重。
    # [作用与调节] Hybrid航道外岸边渐变代价倍率。增大：远离岸边；减小：可更贴低代价岸区；硬阈值仍生效。
    channel.outside_map_weight: 2.0
    # 独立航道障碍物膨胀权重，在所有航道区域内都生效。
    # [作用与调节] 独立障碍软膨胀代价倍率。增大：提前更宽避让；减小：更靠近障碍但不得越硬阈值。
    channel.obstacle_inflation_weight: 5.0
    # 防止长距离 Dubins 直连跳过航道软代价，仅在终点附近解析连接。
    # [作用与调节] 允许近端Dubins尾连接的目标距离(m)。增大：更早连接/更快结束、可能少累计航道软代价；减小：更多正常搜索/算力增加。
    channel.analytic_expansion_distance: 18.0

    # 时间同步预测使用的本船典型航速；应接近 DWA 的巡航速度。
    # 最高航速4m/s；用于把路径弧长换算成动态障碍预测到达时间。
    # 必须与 DWA max_vel_x 和仿真器 max_linear_speed 保持一致。
    # [作用与调节] 动态时间同步典型航速(m/s)。增大：预测到达更早；减小：更晚；不是独立控制指令，应与DWA/仿真4m/s一致。
    cruise_speed: 4.0
    # 小型无人船船体半径；动态硬禁入还会至少采用dynamic_hard_distance。
    # [作用与调节] 本船规划圆形半径(m)。增大：硬净空更大、绕行更宽；减小：更贴近且碰撞裕度减小；Hybrid/DWA须一致。
    own_ship_radius: 0.5
    # 安全距离冗余，不是船体半径；Hybrid A*和DWA必须一致。
    # [作用与调节] 两船半径之外的安全冗余(m)。增大：提前/更宽绕行、可行空间减少；减小：更靠近目标、抗跟踪误差更差；两级须一致。
    safety_buffer: 1.0
    # [作用与调节] 追越最小中心净空(m)，普通硬净空为2m；增大使追越更宽，减小到2m以下不再降低普通净空。
    overtaking_safe_distance: 3.0
    # 动态目标最长外推时间；超过该值仍做硬碰撞检查，只停止累加软代价。
    # [作用与调节] 动态软代价累计时域(s)。增大：更关注远期目标轨迹、绕行可能更早；减小：远期软影响弱；超时仍做硬碰撞。
    dynamic_prediction_horizon: 60.0
    # 软避让域倍率。减小会让路径绕得更近，不能小于 1.0。
    # [作用与调节] 软避让距离相对硬净空倍率，至少1。增大：更大软域；减小：更紧绕行；同时受avoidance_radius影响。
    dynamic_soft_distance_factor: 3.5
    # RViz 青色圈，同时也是有实际碰撞风险时的Hybrid A*软避让范围。
    # 7m软域与3m硬域之间保留4m调整带；无碰撞风险的船不累加此软代价。
    # [作用与调节] 动态软避让域半径及RViz青圈(m)。增大：更远提前绕行；减小：更贴近，硬净空不会因此减小。
    avoidance_radius: 7.0
    # 动态船中心距小于该值时禁止进入；外侧至avoidance_radius为软代价区。
    dynamic_hard_distance: 4.0
    # 靠近软避让域时的代价权重，越大越倾向提前绕行。
    # [作用与调节] 目标船软邻近代价权重。增大：更宽/更早绕行；减小：更偏短路径；硬安全仍独立。
    dynamic_cost_weight: 16.0
    # 目标船消息超过此时间未更新时，清空路径并停车。
    # [作用与调节] 目标消息有效时间(s)。增大：容忍通信抖动但预测更旧；减小：更快失联停车、也更易误停。
    target_state_timeout: 2.0
    # 河道静态规划阶段没有虚拟船，缺少目标船消息时仍允许规划；启用真实
    # COLREG 测试且要求感知失联停车时改为 true。
    # [作用与调节] true：配置目标从未出现也使输入失效；false：允许无虚拟船的静态河道规划；已出现目标失联仍需保护。
    require_target_states: false
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    target_odom_topics: [/target_boat/odom]
    # [作用与调节] 与目标话题对应的规划半径数组(m)。增大：目标硬域更大；减小：裕度减少；显示长宽不会自动更新它。
    target_ship_radii: [0.5]

    # 三层 DCPA 阈值（米）：远程监视保持10m，行动/紧急缩到5/2.5m。
    # [作用与调节] 对应风险层的DCPA上限(m)，还需满足当前距离或TCPA条件。增大：更多未来近遇算风险、提前行动；减小：预警更紧但可能更晚避让；保持监测>=行动>=紧急。
    risk.monitor_dcpa: 10.0
    # [作用与调节] 对应风险层的DCPA上限(m)，还需满足当前距离或TCPA条件。增大：更多未来近遇算风险、提前行动；减小：预警更紧但可能更晚避让；保持监测>=行动>=紧急。
    risk.action_dcpa: 5.0
    # [作用与调节] 对应风险层的DCPA上限(m)，还需满足当前距离或TCPA条件。增大：更多未来近遇算风险、提前行动；减小：预警更紧但可能更晚避让；保持监测>=行动>=紧急。
    risk.emergency_dcpa: 2.5
    # 三层当前中心距离阈值（米），RViz黄/橙/红细圈的半径。
    # 80m监视层模拟AIS式远程预警并保持不变；24m行动、8m紧急层缩小。
    # 它们不是传感器截止距离，也不是2m停车/7m软规划域。
    # [作用与调节] AIS式远程监视距离(m)，与TCPA为OR且仍需满足DCPA；不是感知截止、软域或停车圈。
    risk.monitor_range: 80.0
    # [作用与调节] 行动层距离(m)，与16s TCPA为OR且仍需满足DCPA；增大更早行动，减小更晚。
    risk.action_range: 24.0
    # [作用与调节] 紧急层距离(m)，与6s TCPA为OR且仍需满足DCPA；不是2m最终停车线。
    risk.emergency_range: 8.0
    # 三层 TCPA 阈值（秒）：40秒远程监测保持不变，行动/紧急缩到16/6秒。
    # 仍需同时满足对应DCPA门槛；RViz预测线时间标签同步读取这些值。
    # [作用与调节] 对应风险层TCPA上限(s)，还需满足DCPA门槛。增大：提前预警/行动；减小：更晚、更紧迫；负TCPA通常表示最近会遇已过去，仍有当前距离独立保护。
    risk.monitor_tcpa: 40.0
    # [作用与调节] 对应风险层TCPA上限(s)，还需满足DCPA门槛。增大：提前预警/行动；减小：更晚、更紧迫；负TCPA通常表示最近会遇已过去，仍有当前距离独立保护。
    risk.action_tcpa: 16.0
    # [作用与调节] 对应风险层TCPA上限(s)，还需满足DCPA门槛。增大：提前预警/行动；减小：更晚、更紧迫；负TCPA通常表示最近会遇已过去，仍有当前距离独立保护。
    risk.emergency_tcpa: 6.0
    # 历史会遇记录的解除条件：TCPA 小于 -2 s 且距离大于 6 m，连续 2 次即解除。
    # 实际航向动作可由“已安全通过+恢复方向无碰撞”在此之前立即退出，不等待计时。
    # [作用与调节] 历史会遇释放要求TCPA小于此值(s)。数值增大接近0：更早释放；更负：更晚；安全recovering动作退出还看通过几何。
    risk.release_tcpa: -2.0
    # [作用与调节] 历史释放最小中心距离(m)。增大：更晚解锁；减小：更早解锁；不等于2m当前距离最终停车线。
    risk.release_range: 6.0
    # [作用与调节] 满足释放条件的连续观察次数。增大：更抗抖动但记录更久；减小：解除更快；恢复动作不必等记录解除。
    risk.release_observations: 2
    # 已观察到目标船开始机动后，等待其 DCPA 改善的最长时间。
    # [作用与调节] 已观察到对方机动后允许DCPA改善的等待尺度(s)。增大：更容忍机动、接管可能更迟；减小：更快判定无效。
    risk.manoeuvre_grace: 6.0

    # 是否发布 /colregs/risk_markers，供 RViz 显示全部风险图层。
    # [作用与调节] true：发布风险Marker；false：关闭风险显示，风险判断/安全检查仍执行。
    visualization.enabled: true

    # COLREGs encounter assessment and directional preference.
    # [作用与调节] 规则转向偏好软代价。增大：更偏向规则方向；减小：规则软偏好变弱；headingAllowed等硬约束仍执行。
    colregs_weight: 8.0
    # [作用与调节] 方向软代价死区(rad)。增大：允许更多微小相反偏转不罚；减小：小偏差也受罚，可能更敏感。
    colregs_heading_deadband: 0.05
    # 兼容会遇预测门槛；默认tracking_only的DWA不读取同名目标船停车参数。
    # 不等于感知半径，三层风险依然由risk.*共同判定。
    # [作用与调节] 兼容assessEncounter风险距离(m)。增大/减小影响兼容评估；当前主分层使用risk.*；DWA同名参数执行2m当前距离STOP。
    colregs_risk_distance: 2.0
    # [作用与调节] 兼容assessEncounter外推时域(s)。增大：更多远期会遇进入评估；减小：兼容评估更近；当前主风险使用risk.*。
    colregs_time_horizon: 60.0
    # [作用与调节] assessEncounter对遇相对方位范围(rad)。增大：更多侧向目标算对遇；减小：更严格；Policy首次锁定还含固定工程门槛，非全部由此项控制。
    head_on_bearing: 0.3490658504   # 20 degrees, engineering threshold
    # [作用与调节] assessEncounter对向航向容差(rad)。增大：更多非严格对向被算对遇；减小：更严格；Policy锁定内部另有固定门槛。
    head_on_course_tolerance: 0.3490658504
    # [作用与调节] 兼容交叉方位边界(rad)。增大/减小改变交叉与其他类型边界；Policy锁定内部固定112.5度，不应只调此项预期全系统变化。
    crossing_bearing_limit: 1.963495  # 112.5 degrees
    # [作用与调节] 兼容追越速度差门槛(m/s)。增大：更难判追越；减小：更易判追越；Policy锁定内部另有固定门槛。
    overtaking_speed_margin: 0.2
