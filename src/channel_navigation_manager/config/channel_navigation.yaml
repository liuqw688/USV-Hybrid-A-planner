channel_navigation_node:
  ros__parameters:
    # river_chart 一次性发布的 TSSLPT 多边形和 ORIENT 数据。
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    lane_data_topic: /chart_lane_data
    # 仅用它的尺寸、分辨率和原点生成完全对齐的航道策略栅格。
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    costmap_topic: /local_costmap
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    odom_topic: /odom
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    goal_topic: /goal_pose
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    lane_costmap_topic: /channel/lane_costmap
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    marker_topic: /channel/navigation_markers
    # [作用与调节] ROS消息接口名称（列表按目标对应）。修改需同时匹配发布方/订阅方及RViz；名称大小没有调参含义，失配会收不到数据并等待/停车。
    status_topic: /channel/status

    # 策略层编码：主航道=0..20，航道外=45，对向航道=75。
    # Hybrid A* 使用独立权重，数值只表示区域类别，不是碰撞概率。
    # [作用与调节] 航道外类别编码。不是物理风险值；改变大小要同步全局/Hybrid/DWA类别约定。
    outside_value: 45
    # [作用与调节] 左/对向航道类别编码。不是膨胀距离；改变编码要同步各规划器，否则分类失配。
    opposite_value: 75
    # 主航道中心为低代价，边沿最大为20；20仍属于可通行主航道。
    # 增大该值会更强地排斥边沿，但必须小于 outside_value。
    # [作用与调节] 主航道边沿软梯度上限。增大：边沿代价更高、更靠中心；减小：可贴边抄近路；须不超过各规划器主航道上界。
    main_lane_edge_value: 20
    # 距边界16m内形成连续中心梯度。该范围覆盖大部分分道宽度，使远目标
    # 不会仅为缩短欧氏距离而长期贴着主航道左/右边沿。
    # [作用与调节] 中心梯度的边界作用距离(m)。增大：更宽范围受到边沿排斥；减小：只有贴边才有代价；窄航道仍做中心处理。
    center_clearance: 16.0

    # 速度低于该值时保持上一次有效航行方向，避免停车时航道反复翻转。
    # [作用与调节] 更新COG所需最小速度(m/s)。增大：低速时更多保持旧方向；减小：低速噪声更易翻转角色；不是最低实际船速。
    minimum_course_speed: 0.10
    # 实际航迹向变化超过约 12° 才重新分类，降低整幅策略图发布频率。
    # [作用与调节] COG策略变化触发语义重建的角度(rad)。增大：重建少、方向更新迟；减小：更灵敏但更吃资源且可能频繁触发全局纠偏。
    reclassify_angle: 0.2094395102
    # 弯曲航道不再让所有区域都与“起始艏向”比较，而是从本船附近分道开始，
    # 沿相邻航段的 ORIENT 连续传播。同一方向允许相邻段逐步转弯，但不会跨到
    # 约180°相反的对向分道。
    # [作用与调节] 传播时航段多边形邻接距离(m)。增大：易连通断段、也易误连支流；减小：更严格、可能漏掉同向航段。
    lane_adjacency_distance: 160.0
    # [作用与调节] 邻接航段ORIENT最大变化(rad)。增大：接受急弯但更易串错航道；减小：同向急弯可能断开；不是全图与船头夹角。
    lane_continuity_angle: 1.3962634016  # 80 degrees

    # 新目标与当前航迹向相差超过 110° 时，提前按目标方向翻转主航道。
    # 因此北航时东北/西北目标不翻转，南方目标会在掉头前切到西侧航道。
    # [作用与调节] 后方目标提前反向的方位差门槛(rad)。增大：更难触发翻转；减小：侧方目标也可能翻转，切目标时更易误分类。
    reverse_enter_angle: 1.9198621772
    # 船的实际航迹向接近新方向 35° 后，结束提前翻转状态，恢复按 COG 更新。
    # [作用与调节] COG接近反向任务方位后结束提前翻转的容差(rad)。增大：更早交回COG；减小：保持反向意图更久；需配合进入门槛。
    reverse_complete_angle: 0.6108652382
    # 太近的目标不触发整套反向航道切换，防止终点附近抖动。
    # [作用与调节] 允许提前反向的最小目标距离(m)。增大：近目标不会翻转；减小：近目标也可能反复改角色。
    minimum_reverse_goal_distance: 10.0
