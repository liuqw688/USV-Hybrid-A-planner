channel_navigation_node:
  ros__parameters:
    # usv_map 的静态海图接口；输出地图完整复制它的 width/height/resolution/origin。
    chart_costmap_topic: /chart_costmap
    chart_lane_topic: /chart_lane_data

    # 船位和 RViz 目标。目标存在时使用“本船 -> 目标点”的方向判断同向/反向航道。
    odom_topic: /odom
    goal_topic: /goal_pose
    # 多航点任务：根据首段选择 CW/CCW，之后沿整条航道保持该方向。
    goal_path_topic: /path

    # 航道代价地图与 RViz Marker 输出。
    channel_costmap_topic: /channel_costmap
    marker_topic: /channel_navigation_markers

    # 感知输入为“当前帧完整列表”；空列表立即清除临时障碍，不依赖海图中的暗礁真值。
    detections_topic: /obstacle_detections
    # 观测/消息超过此秒数后失效并恢复基础代价，避免节点退出后残留障碍（仿真策略）。
    detection_timeout_s: 3.0
    # 感知圆形障碍额外膨胀，单位 m；最终禁行半径 = 消息 radius_m + 此值。
    # 只在代价节点膨胀一次，不改变传感器发布的实际大小。
    detection_inflation_m: 2.0

    # 四类基础代价；航道内部额外叠加横断面偏心软代价。
    same_direction_cost: 0
    opposite_direction_cost: 20
    open_water_cost: 20
    obstacle_cost: 100
    # 横断面中心增加 0、边缘增加本值；0 关闭居中偏好。
    # 默认同向 0~8、普通水域 20、对向 20~28、障碍物 100；绕障可离开中心。
    lane_center_cost: 8

    # 本船附近航段的 ORIENT 与任务方向夹角阈值，单位度。
    # 选定 CW/CCW 后沿整条弯曲航道保持一致，避免每个转弯重新反转代价。
    direction_tolerance_deg: 90.0
    # 动态航道方向箭头长度，单位米；黄色为低代价，红色为高代价。
    direction_arrow_length_m: 12.0
    # 输出频率上限，单位 Hz；仅在底图、航道、船位、目标或探测快照发生更新时发布。
    # 静态几何的栅格覆盖缓存复用，地图/航道更新后自动重建。
    publish_rate_hz: 5.0

# 仿真传感器节点；切换真实感知时关闭此节点，由实际传感器适配器发布同类型话题。
obstacle_perception_sim_node:
  ros__parameters:
    # 真值仅供仿真节点使用，读取其中 kind=REEF 的多边形。
    chart_lane_topic: /chart_lane_data
    odom_topic: /odom
    detections_topic: /obstacle_detections
    marker_topic: /perception_markers
    # 360° 圆形探测范围，单位 m；最近边缘进入圆时，报告标签、方位、距离和包围半径。
    perception_radius_m: 60.0
    # 船位接收或观测时间超过此秒数后，停止探测并发布空快照。
    # 里程计失效超时(s)，应大于实际发布间隔，并留出通信抖动余量。
    odom_timeout_s: 3.0
    # Hz；无目标也持续发送空快照。感知未建模遮挡、漏检或测距噪声。
    publish_rate_hz: 5.0
