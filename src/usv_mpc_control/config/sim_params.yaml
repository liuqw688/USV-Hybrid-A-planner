boat_simulator:
  ros__parameters:
    # 实际河道测试起点（已验证位于 ORIENT=327° 的 TSSLPT 分道内）。
    # [作用与调节] 本船起点东向坐标(m)。增大向东、减小向西；必须在地图有效安全水域，重启才加载。
    start_x: -850.0 #-270.0
    # [作用与调节] 本船起点北向坐标(m)。增大向北、减小向南；必须与海图坐标/scale一致。
    start_y: -850.0 #-270.0
    # S-57 327°（真北顺时针）换算为 ROS ENU yaw 约 123°。
    # [作用与调节] 本船初始ROS yaw(rad)，0东、正逆时针。增大逆时针转、减小顺时针；低速首次COG会采用该方向。
    start_yaw: 0.0 #2.14675498
    # 最高航速4m/s；MPC有效路径出现后直接输出纵向推力与偏航力矩。
    # [作用与调节] 本船初始前向速度(m/s)。增大：初始运动更快；减小：更慢；推力模式下不允许倒车。
    initial_speed: 4.0
    # 仿真器硬限速，避免控制命令超过船舶最高航速。
    # 必须与 MPC max_speed 和 Hybrid A* cruise_speed 保持一致。
    # [作用与调节] 本船仿真线速度硬上限(m/s)。增大：允许更快航行；减小：限制最大速度；需与规划和控制器同步。
    max_linear_speed: 4.0
    # 六状态欠驱动模型系数，与MPC及Hybrid规划模型保持一致。
    model.k_u: 0.290681
    model.k_t: 0.295742
    model.k_turn: 2.126739
    # kv：侧滑阻尼；k_vr：转艏诱导侧滑系数（此模型为负）；k_vN：偏航力矩侧向耦合。
    model.k_v: 0.425383
    model.k_vr: -1.149012
    model.k_vn: 0.0
    # kr/kr3：线性/三次转艏阻尼；kN：偏航力矩到转艏角加速度增益。
    model.k_r: 1.342561
    model.k_r3: 0.0
    model.k_n: 0.781688
    # tau_y与tau_N的对称限幅，单位沿用水动力模型标定输入单位（不是m/s或rad/s）。
    # 增大提高加速/转艏能力；过小会降低控制器响应能力，过大可能造成仿真动作过猛。
    max_tau_y: 10.0
    max_tau_n: 5.0
    # 艏摇率硬限幅(rad/s)，需与MPC max_yaw_rate及Hybrid A*船模同步。
    max_angular_speed: 0.45
