boat_simulator:
  ros__parameters:
    # 实际河道测试起点（已验证位于 ORIENT=327° 的 TSSLPT 分道内）。
    # [作用与调节] 本船起点东向坐标(m)。增大向东、减小向西；必须在地图有效安全水域，重启才加载。
    start_x: -850.0 #-270.0
    # [作用与调节] 本船起点北向坐标(m)。增大向北、减小向南；必须与海图坐标/scale一致。
    start_y: -850.0 #-270.0
    # S-57 327°（真北顺时针）换算为 ROS ENU yaw 约 123°。
    # [作用与调节] 本船初始ROS yaw(rad)，0东、正逆时针。增大逆时针转、减小顺时针；低速首次COG会采用该方向。
    start_yaw: 0.0 #2.14675498
    # 最高航速4m/s；MPC有效路径出现后输出纵向和转向速度指令。
    # [作用与调节] 本船初始前向速度(m/s)。增大：初始运动更快；减小：更慢；速度指令不允许倒车。
    initial_speed: 4.0
    # 仿真器硬限速，避免控制命令超过船舶最高航速。
    # 必须与 MPC max_speed 和 Hybrid A* cruise_speed 保持一致。
    # [作用与调节] 本船仿真线速度硬上限(m/s)。增大：允许更快航行；减小：限制最大速度；需与规划和控制器同步。
    max_linear_speed: 4.0
    # Fast-Planner 速度指令上下限，公式与规划器一致。
    max_v_cmd: 2.0
    max_w_cmd: 0.3
    # 艏摇率硬限幅(rad/s)，需与MPC max_yaw_rate及Hybrid A*船模同步。
    max_angular_speed: 0.45
